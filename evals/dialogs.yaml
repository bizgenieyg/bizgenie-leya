# Эталонные диалоги (задание N). Прогон: npm run eval:dialogs -- --tenant=<uuid> [--runs=3]
# Проверки маршрута (stage, intent, model_calls, request, discovery) — порог 100 %;
# текстовые (must, must_not, max_questions, max_sentences) — порог 90 %.
scenarios:
  - id: greeting-ru
    title: "«привет» — шаблон, без модели"
    turns:
      - text: привет
        stage: intent_unknown
        model_calls: 0
        must: ['Чем могу помочь\?']
        max_questions: 1

  - id: greeting-he
    title: "«שלום» — шаблон на иврите"
    turns:
      - text: שלום
        stage: intent_unknown
        model_calls: 0
        must: ['במה אפשר לעזור']

  - id: evening-then-about
    title: "«добрый вечер!» → «хочу узнать про вас» без вопроса из списка"
    turns:
      - text: добрый вечер!
        model_calls: 0
      - text: хочу узнать про вас
        max_model_calls: 1
        no_discovery: true
        max_questions: 1
        max_sentences: 4
        must_not: ['с радостью', 'чем могу помочь']

  - id: greeting-plus-price
    title: "«привет, сколько стоит бот?» — не голое приветствие"
    turns:
      - text: привет, сколько стоит бот?
        max_model_calls: 1
        no_discovery: true
        max_questions: 1
        must_not: ['^Здравствуйте! Это .*Чем могу помочь\?$', 'зависит[^0-9]*$']

  - id: salon-discovery
    title: "«что умеете?» → «у меня салон» → «а цена?»; вопрос из списка не раньше 2-го хода, ≤1 за ход"
    turns:
      - text: что вы умеете?
        max_model_calls: 1
        no_discovery: true
        max_questions: 1
      - text: у меня салон красоты
        max_model_calls: 1
        max_questions: 1
        max_discovery_total: 1
      - text: а цена?
        max_model_calls: 1
        max_questions: 1
        max_discovery_total: 2

  - id: thanks-ok-thumb
    title: "«спасибо» / «ок» / «👍» — без маршрутизации и вопросов"
    turns:
      - text: спасибо
        model_calls: 0
        max_questions: 0
      - text: ок
        model_calls: 0
        max_questions: 0
      - text: 👍
        model_calls: 0
        max_questions: 0

  - id: support-broken-order
    title: "«мой заказ не работает» — support, без вопросов о потребности"
    turns:
      - text: мой заказ не работает
        intent: support
        max_model_calls: 1
        no_discovery: true

  - id: sale-then-support
    title: "продажа → «а у меня ещё проблема с оплатой» — переключение в support"
    turns:
      - text: сколько стоит подключение ассистента?
        intent: sale
        max_model_calls: 1
      - text: а у меня ещё проблема с оплатой
        intent: support
        max_model_calls: 1

  - id: meeting-thursday
    title: "«хочу встречу в четверг» — заявка"
    turns:
      - text: хочу встречу в четверг
        request: true
        max_model_calls: 1
        must: ['свяжется с вами']
        must_not: ['Передать']

  - id: sector-and-size-given
    title: "клиент сам назвал сферу и размер — не переспрашивать"
    turns:
      - text: у меня салон красоты, нас трое, клиенты пишут в WhatsApp. Что вы можете предложить?
        max_model_calls: 1
        max_questions: 1
        must_not: ['сколько (в нём|у вас) человек', 'чем занимается (ваш )?бизнес']
      - text: интересно, а сколько стоит?
        max_model_calls: 1
        max_questions: 1
        must_not: ['сколько (в нём|у вас) человек', 'чем занимается (ваш )?бизнес']

  - id: out-of-base
    title: "вопрос вне базы — честная эскалация"
    turns:
      - text: вы работаете с клиниками пластической хирургии в Эйлате по субботам?
        max_model_calls: 1
        must_not: ['да, работаем']

  - id: three-substantive
    title: "3 содержательных хода подряд — вопросов из списка ≤ 3"
    turns:
      - text: расскажите, что вы делаете для малого бизнеса
        max_model_calls: 1
      - text: а как это работает с WhatsApp?
        max_model_calls: 1
        max_questions: 1
      - text: сколько времени занимает подключение?
        max_model_calls: 1
        max_questions: 1
        max_discovery_total: 3

  - id: is-it-yuri
    title: "«Здравствуйте, Юрий?» — честно: ассистент"
    turns:
      - text: Здравствуйте, Юрий?
        max_model_calls: 1
        must: ['ассистент']
        must_not: ['^Да, это Юрий', 'я Юрий']

  - id: known-by-history
    title: "знакомый по истории клиент пишет «привет» — без повторного представления, профиль из истории; повторное приветствие в другой день без вызовов"
    history:
      - { from: client, text: 'Добрый день! Сделаете мне лендинг для кейтеринга?' }
      - { from: business, text: 'Да, конечно. Пришлите меню и фото.' }
      - { from: client, text: 'Спасибо, пришлю завтра. Кстати, я Марина.' }
    turns:
      - text: привет
        model_calls: 1
        must_not: ['Это .*ассистент']
        must: ['Чем могу помочь\?']
      - text: привет
        after_days: 1
        model_calls: 0
        must: ['Чем могу помочь\?']
        must_not: ['Это .*ассистент']

  - id: english-hi
    title: "«hi» — шаблон на английском"
    turns:
      - text: hi
        model_calls: 0
        must: ['How can I help\?']

  # ── Задание Q: приветствие без имени владельца, простой язык, шаг в конце, заявка только с согласия ──
  - id: q-car-rental-ru
    title: "аренда авто: «по объявлениям» — не заявка; без жаргона и страшилок; каждый ответ со шагом"
    turns:
      - text: привет
        model_calls: 0
        must: ['цифровой ассистент']
        must_not: ['ассистент Юри']
      - text: чем вы занимаетесь?
        max_questions: 1
        must_not: ['\bAPI\b', '\bCRM\b', 'интеграц', 'блокир', 'напишите «']
      - text: у меня аренда авто
        max_questions: 1
        must: ['\?\s*$']
        must_not: ['\bAPI\b', '\bCRM\b', 'блокир', 'напишите «']
      - text: а как это мне поможет?
        max_questions: 1
        must: ['\?\s*$']
        must_not: ['\bAPI\b', 'блокир', 'напишите «']
      - text: по объявлениям
        request: false
        max_questions: 1
        must_not: ['Передать', 'свяжется', 'блокир']

  - id: q-car-rental-he
    title: "השכרת רכב: «מודעות» — לא בקשה, קודם שאלת הסכמה"
    turns:
      - text: שלום
        model_calls: 0
        must: ['עוזרת דיגיטלית']
      - text: יש לי השכרת רכב
        must_not: ['API', 'CRM', 'חסימ']
      - text: איך זה יעזור לי?
        must_not: ['API', 'חסימ']
      - text: מודעות
        request: false
        must_not: ['העברתי', 'ייצור איתך קשר']

  - id: q-just-looking
    title: "«не знаю, просто смотрю» — типичная проблема → пример → предложение"
    turns:
      - text: не знаю, просто смотрю
        request: false
        max_questions: 1
        must: ['\?\s*$']
        must_not: ['блокир', 'напишите «']

  - id: q-too-expensive
    title: "«дорого» — согласие, факт, шаг; второе «нет» — без нового предложения"
    turns:
      - text: какая цена подключения?
      - text: дорого
        request: false
        must: ['1500', '\?\s*$']
        must_not: ['блокир']
      - text: нет
        request: false
        max_questions: 0
        must_not: ['демо', 'Передать']

  - id: q-direct-demo
    title: "«хочу демо» первым сообщением — заявка сразу, одно подтверждение"
    turns:
      - text: хочу демо
        request: true
        must: ['свяжется с вами']
        must_not: ['Передать', 'Передала']

  - id: q-offer-yes
    title: "бот предложил встречу (интерес к цене) → «да» → заявка без вызова модели, одно подтверждение"
    turns:
      - text: какая цена подключения?
        request: false
        must: ['\?\s*$']
      - text: да
        request: true
        model_calls: 0
        must: ['свяжется с вами']
        must_not: ['Передать']

  - id: q-offer-no
    title: "предложение → «нет, спасибо» → нет заявки и повторного предложения"
    turns:
      - text: какая цена подключения?
        request: false
      - text: нет, спасибо
        request: false
        must_not: ['Передать', 'покаж', 'встреч', 'демо']
      - text: а что входит в подключение?
        request: false
        must_not: ['покаж', 'встреч', 'демо']

  - id: x-simulator-29-09
    title: "диалог 29.09: общий вопрос без встречи, «да хочу» без предложения — не заявка, потом одно предложение и одно подтверждение"
    turns:
      - text: привет
        model_calls: 0
      - text: как мне может помочь Лея?
        max_questions: 1
        must: ['\?\s*$']
        must_not: ['покаж', 'встреч', 'демо', 'свяжется']
      - text: да хочу
        request: false
        must_not: ['свяжется', 'Передать', 'передан']
      - text: у меня салон красоты, хочу посмотреть, как это работает
        request: false
        must: ['\?\s*$']
        must_not: ['(^|[^а-яё])покажу']
      - text: да
        request: true
        model_calls: 0
        must: ['свяжется с вами']
        must_not: ['Передать']

  - id: q-risks
    title: "«это надёжно? не заблокируют?» — честно о рисках"
    turns:
      - text: это надёжно? не заблокируют?
        max_questions: 1
        must: ['блокир']
