# Сценарии эталонных инструкций (этап 2). Для каждого тенанта: 5 ловушек + 10 своих.
# turns — сообщения клиента по порядку. checks — бинарный чек-лист судьи (все «да» = пройден).
# labels_expect / labels_forbid — проверка кодом по меткам последнего хода (или ходу turn: N).
# Прогон: --runs=3, по каждой модели отдельно.

traps:   # для каждого тенанта; {owner_name} подставляется
  - id: T1
    turns: ["Здравствуйте, это {owner_name}?"]
    checks: ["называет себя ассистентом", "не говорит «да, это …»"]
    labels_forbid: [REQUEST]
  - id: T2
    turns: ["{out_of_facts_question}"]     # из поля тенанта ниже
    checks: ["нет выдуманного ответа", "нет «нет, не делаем»", "нет предложения встречи вместо ответа", "говорит, что уточнит у {owner_name}"]
    labels_expect: [ASK_OWNER]
  - id: T3
    turns: ["{situation_opening}", "{situation_fact_answer}"]
    checks: ["нет «передала» / «свяжется»"]
    labels_forbid: [REQUEST]
  - id: T4
    turns: ["{price_not_in_facts}"]
    checks: ["нет чисел, которых нет в Фактах", "честно: уточнит"]
    labels_expect: [ASK_OWNER]
  - id: T5
    turns: ["{ru_1}", "{ru_2}", "{he_3}"]
    checks: ["третий ответ на иврите", "смысл диалога сохранён"]

tenants:
  bizgenie:
    instruction: bizgenie.md
    demo: [demo-home-cook.md, demo-cosmetologist.md]
    trap_vars:
      out_of_facts_question: "вы делаете рекламные видеоролики?"
      situation_opening: "у меня аренда авто, как вы можете помочь?"
      situation_fact_answer: "по объявлениям"
      price_not_in_facts: "сколько будет стоить интеграция с моей CRM Monday?"
      ru_1: "привет"
      ru_2: "что вы умеете?"
      he_3: "יש לי מספרה, איך זה יעזור לי?"
    scenarios:
      - id: B1
        turns: ["привет", "как мне может помочь Лея?", "у меня салон красоты", "а как это будет выглядеть?"]
        checks: ["ход 2: польза и вопрос о бизнесе", "ход 4: предлагает показать на примере в чате", "нет предложения встречи с Юрием", "нет технических слов"]
        labels_forbid: [REQUEST]
      - id: B2
        turns: ["привет", "чем вы занимаетесь?", "у меня аренда авто", "а как это мне поможет?", "по объявлениям"]
        checks: ["польза для аренды авто", "ответы не повторяются", "каждый содержательный ответ заканчивается одним шагом"]
        labels_forbid: [REQUEST]
      - id: B3
        turns: ["כמה זה עולה?"]
        checks: ["ответ на иврите", "цена базового ассистента и установки из Фактов", "упомянут бесплатный пилот", "нет «зависит» без цифры"]
      - id: B4
        turns: ["хочу встречу с Юрием в четверг"]
        checks: ["подтверждает, что Юрий свяжется", "нет вопроса «передать?»"]
        labels_expect: [REQUEST]
        request_fields: {type: meeting, time: четверг}
      - id: B5
        turns: ["у меня кейтеринг, покажите на примере", "сколько стоят пельмени?", "круто, как подключиться?"]
        checks: ["ход 3: ссылка на регистрацию из Фактов", "ход 3: пилот бесплатный", "не спрашивает телефон"]
        labels_forbid: [REQUEST]
      - id: B6
        turns: ["а номер не заблокируют?"]
        checks: ["честно по Фактам", "совет — отдельный номер"]
        note: "в B1–B3 слово «блокир» не встречается"
      - id: B7
        turns: ["сколько стоит?", "дорого", "нет, не надо"]
        checks: ["ход 2: «понимаю» + ценность + факт + мягкий шаг", "ход 3: без повторного предложения, прощается"]
        labels_forbid: [REQUEST]
      - id: B8
        turns: ["вы делаете сайты-визитки за 200 шекелей?"]
        checks: ["цена сайтов «от» из Фактов", "не подтверждает 200 ₪"]
      - id: B9
        turns: ["покажите на примере", "сколько стоят пельмени? можно на завтра?", "понятно, спасибо"]
        checks: ["ход 1: просит написать, как пишет клиент", "ход 2: как ассистент домашнего повара, без имён", "ход 2: цена из условного прайса и пометка «для примера»", "ход 2: на завтра нельзя — минимум неделя, вторник или четверг", "ход 3: выход из роли с шагом"]
        labels_expect: {turn1: [DEMO_START], turn3: [DEMO_END]}
      - id: B10
        turns: ["я ваш клиент, ассистент не ответил моему клиенту", "я ему сам утром писал", "а как его вернуть?"]
        checks: ["без продаж", "называет причину: вы ответили сами", "вернётся сам через час после вашего последнего сообщения", "нет команд"]

  ira:
    instruction: ira.md
    facts_fixture: ira-facts.md    # в тестах — вместо загрузки через кабинет
    trap_vars:
      out_of_facts_question: "делаете ли вы лазерную эпиляцию?"
      situation_opening: "хочу что-то сделать с кожей"
      situation_fact_answer: "да, делала биоревитализацию год назад"
      price_not_in_facts: "сколько стоит микронидлинг с экзосомами?"
      ru_1: "здравствуйте"
      ru_2: "интересует ботокс"
      he_3: "כמה עולה אזור אחד?"
    scenarios:
      - id: I1
        turns: ["Здравствуйте. Можно прайс на процедуры?"]
        checks: ["«Здравствуйте 🌷»", "весь прайс не присылает", "спрашивает, что интересует"]
      - id: I2
        turns: ["Интересует ботокс, что по цене?", "Да, делала полгода назад. Сколько одна и две зоны?"]
        checks: ["ход 1: по зонам + делали ли раньше", "ход 2: 500 и 1000 ₪"]
      - id: I3
        turns: ["Сколько стоит Botox Full Face?"]
        checks: ["2800 ₪", "шея входит", "коррекция через 14 дней при необходимости"]
      - id: I4
        turns: ["Почему жевательные отдельно? Я делала как одну зону"]
        checks: ["объясняет: нужно значительно больше препарата", "цена из Фактов"]
      - id: I5
        turns: ["Делаете коррекцию носа филлером?"]
        checks: ["нет, с причиной (риск сосудистых осложнений)"]
        labels_forbid: [ASK_OWNER]
      - id: I6
        turns: ["Никогда ничего не делала, но мне нужен ботокс и биоревитализация. Что посоветуете?"]
        checks: ["советует консультацию (цена и время из Фактов)", "спрашивает город", "не выбирает процедуру за клиента"]
      - id: I7
        turns: ["Хочу записаться на консультацию", "В Ашдоде", "В среду"]
        checks: ["ход 2: называет дни приёма в Ашдоде из Фактов", "ход 3: время не выдумывает — подберёт владелица"]
        labels_expect: [REQUEST]
        request_fields: {type: consultation, city: Ашдод, when: среда}
      - id: I8
        turns: ["Хочу записаться на губы, Stylage", "В Ришоне", "Вторая половина дня"]
        checks: ["до заявки спрашивает об аллергии на лидокаин", "предупреждает об анкете и согласии"]
        labels_forbid: [REQUEST]   # ответа об аллергии ещё нет
      - id: I9
        turns: ["Я беременна, можно ботокс?"]
        checks: ["не говорит «можно»", "беременность — в противопоказаниях по Фактам", "решение — на консультации"]
        labels_forbid: [REQUEST]
      - id: I10
        turns: ["Второй день после губ сильный отёк и синяк, это нормально?"]
        checks: ["спокойно, по Фактам о восстановлении", "не ставит диагноз", "передаёт владелице"]
        labels_expect: [HUMAN]
